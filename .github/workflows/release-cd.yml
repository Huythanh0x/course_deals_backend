name: Release CD (Backend)

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        type: string
      is_draft:
        description: 'Publish as Draft'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Publish as Pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-cd-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Backend & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Executable Spring Boot JARs
        run: ./gradlew :modules:coupon-api-service:bootJar :modules:coupon-crawler-service:bootJar -x test

      - name: Collect Release JARs
        run: |
          mkdir -p release-assets
          VERSION_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_TAG="${{ inputs.tag_name }}"
          fi
          CLEAN_VER="${VERSION_TAG#v}"

          API_JAR=$(find modules/coupon-api-service/build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          CRAWLER_JAR=$(find modules/coupon-crawler-service/build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -n 1)

          if [ -f "$API_JAR" ]; then
            cp "$API_JAR" "release-assets/coupon-api-service-${CLEAN_VER}.jar"
          fi
          if [ -f "$CRAWLER_JAR" ]; then
            cp "$CRAWLER_JAR" "release-assets/coupon-crawler-service-${CLEAN_VER}.jar"
          fi

      - name: Set up Docker Buildx
        if: env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_TOKEN != ''
        uses: docker/setup-buildx-action@v3
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Images
        if: env.DOCKER_HUB_USERNAME != '' && env.DOCKER_HUB_TOKEN != ''
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          BASE_IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/training-coupon-services
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_TAG="${{ inputs.tag_name }}"
          fi
          CLEAN_VER="${VERSION_TAG#v}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg SERVICE_NAME=coupon-api-service \
            -t "${BASE_IMAGE_NAME}:api-${CLEAN_VER}" \
            -t "${BASE_IMAGE_NAME}:api-latest" \
            --push .

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg SERVICE_NAME=coupon-crawler-service \
            -t "${BASE_IMAGE_NAME}:crawler-${CLEAN_VER}" \
            -t "${BASE_IMAGE_NAME}:crawler-latest" \
            --push .

      - name: Compute Checksums
        run: |
          cd release-assets
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: CourseDeals Backend Services ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.is_draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.is_prerelease || false }}
          generate_release_notes: true
          files: |
            release-assets/*
