spring:
  application:
    name: coupon-api-service
  datasource:
    url: jdbc:mysql://mysql:3306/training_coupon
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: redis
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}

jobrunr:
  background-job-server:
    enabled: false # API only enqueues
  dashboard:
    enabled: true
    port: 8000

custom:
  jwt-expiration: ${CUSTOM_JWT_EXPIRATION:86400000}
  jwt-secret: ${CUSTOM_JWT_SECRET:}
  mock-auth-enabled: ${CUSTOM_MOCK_AUTH_ENABLED:false}
  async:
    scraper:
      core-pool-size: ${CUSTOM_ASYNC_CORE_POOL_SIZE:5}
      max-pool-size: ${CUSTOM_ASYNC_MAX_POOL_SIZE:10}
      queue-capacity: ${CUSTOM_ASYNC_QUEUE_CAPACITY:100}
  refresh-secret: ${CUSTOM_REFRESH_SECRET:}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  firebase:
    config-path: ${FIREBASE_CONFIG_PATH:}
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:coursedeal.thanh0x.com}
    rp-name: ${WEBAUTHN_RP_NAME:Course Deal}
    origins: ${WEBAUTHN_ORIGINS:https://coursedeal.thanh0x.com}
