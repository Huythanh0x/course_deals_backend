spring:
  datasource:
    url: jdbc:mysql://localhost:3306/training_coupon?connectTimeout=10000&socketTimeout=30000
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}

jobrunr:
  background-job-server:
    enabled: false
  dashboard:
    enabled: true
    port: 8000

logging:
  level:
    org.springframework.web: DEBUG

custom:
  jwt-expiration: ${CUSTOM_JWT_EXPIRATION:86400000}
  jwt-secret: ${CUSTOM_JWT_SECRET:local_dev_jwt_secret_key_must_be_at_least_32_characters_long_for_security}
  mock-auth-enabled: true
  google-client-id: ${GOOGLE_CLIENT_ID:local-dev-google-client-id.apps.googleusercontent.com}
  async:
    scraper:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 100

server:
  address: 0.0.0.0
