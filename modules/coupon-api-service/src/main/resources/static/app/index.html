<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Deal — Compose Multiplatform Web App</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%230B57D0' fill-rule='evenodd' d='M 152,52 L 360,52 Q 396,52 396,88 L 396,332 L 256,444 L 116,332 L 116,88 Q 116,52 152,52 Z M 256,56 A 30,30 0 0,1 256,116 A 30,30 0 0,1 256,56 Z'/%3E%3Cpath d='M 228,56 A 36,36 0 0,1 284,56' stroke='%230B57D0' stroke-width='10' stroke-linecap='round' fill='none'/%3E%3Cpath d='M 226,86 a 30,30 0 1,1 60,0 a 30,30 0 1,1 -60,0' stroke='%23FFFFFF' stroke-width='6' fill='none'/%3E%3Cpath fill='%23FFFFFF' d='M 204,196 L 204,320 L 330,258 Z'/%3E%3C/svg%3E">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111318;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #E2E2E6;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1E2025 0%, #111318 75%);
            z-index: 50;
            gap: 14px;
            transition: opacity 0.25s ease;
        }
        .brand-logo {
            width: 68px;
            height: 68px;
            filter: drop-shadow(0 8px 24px rgba(11, 87, 208, 0.45));
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(168, 199, 250, 0.2);
            border-top-color: #A8C7FA;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .progress-track {
            width: 280px;
            height: 6px;
            background: rgba(68, 71, 78, 0.5);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 2px;
        }
        .progress-bar {
            width: 12%;
            height: 100%;
            background: linear-gradient(90deg, #0B57D0, #A8C7FA);
            border-radius: 999px;
            transition: width 0.2s ease;
        }
        .loading-title {
            font-size: 16px;
            font-weight: 700;
            color: #E2E2E6;
            margin: 0;
        }
        .loading-subtitle {
            font-size: 12px;
            color: #C4C6D0;
            margin: 0;
        }
        .action-row {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-switch {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            color: #D3E3FD;
            background: #00458F;
            border: 1px solid rgba(168, 199, 250, 0.35);
            border-radius: 999px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-switch:hover {
            background: #0B57D0;
            color: #FFFFFF;
        }
        .btn-back {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            color: #C4C6D0;
            background: rgba(30, 32, 37, 0.9);
            border: 1px solid #44474E;
            border-radius: 999px;
            text-decoration: none;
            transition: all 0.15s;
        }
        .btn-back:hover {
            color: #E2E2E6;
            border-color: #A8C7FA;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <svg class="brand-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <path fill="#0B57D0" fill-rule="evenodd" d="M 152,52 L 360,52 Q 396,52 396,88 L 396,332 L 256,444 L 116,332 L 116,88 Q 116,52 152,52 Z M 256,56 A 30,30 0 0,1 256,116 A 30,30 0 0,1 256,56 Z"/>
            <path d="M 228,56 A 36,36 0 0,1 284,56" stroke="#0B57D0" stroke-width="10" stroke-linecap="round" fill="none"/>
            <path d="M 226,86 a 30,30 0 1,1 60,0 a 30,30 0 1,1 -60,0" stroke="#FFFFFF" stroke-width="6" fill="none"/>
            <path fill="#FFFFFF" d="M 204,196 L 204,320 L 330,258 Z"/>
        </svg>
        <div class="spinner"></div>
        <p id="loading-title" class="loading-title">Launching Course Deal Web App...</p>
        <div class="progress-track">
            <div id="loading-bar" class="progress-bar"></div>
        </div>
        <p id="loading-status" class="loading-subtitle">Step 1/3: Initializing Compose Multiplatform runtime...</p>
        <div class="action-row">
            <a id="switch-target-btn" href="/app/?target=js" class="btn-switch">Switch to Kotlin/JS (IR) Mode</a>
            <a href="/" class="btn-back">&larr; Back to Landing Page</a>
        </div>
    </div>
    <canvas id="ComposeTarget"></canvas>
    <script>
        (function() {
            var bar = document.getElementById('loading-bar');
            var status = document.getElementById('loading-status');
            var title = document.getElementById('loading-title');
            var switchBtn = document.getElementById('switch-target-btn');

            var params = new URLSearchParams(window.location.search);
            var requestedTarget = params.get('target');
            var ua = navigator.userAgent || '';
            var isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);

            var activeTarget = requestedTarget
                ? (requestedTarget.toLowerCase() === 'js' ? 'js' : 'wasm')
                : (isSafari ? 'js' : 'wasm');

            var engineLabel = activeTarget === 'js' ? 'Kotlin/JS (IR)' : 'Kotlin/Wasm';
            var otherTarget = activeTarget === 'js' ? 'wasm' : 'js';
            var otherLabel = activeTarget === 'js' ? 'Kotlin/Wasm' : 'Kotlin/JS (IR)';

            if (title) {
                title.textContent = 'Launching Course Deal (' + engineLabel + ')...';
            }
            if (switchBtn) {
                switchBtn.href = '/app/?target=' + otherTarget;
                switchBtn.textContent = 'Switch to ' + otherLabel + ' Mode';
            }

            function readResponseBytesWithProgress(res) {
                var total = parseInt(res.headers.get('content-length') || '0', 10);
                if (!res.body || !res.body.getReader) {
                    return res.arrayBuffer();
                }
                var reader = res.body.getReader();
                var chunks = [];
                var loaded = 0;
                function pump() {
                    return reader.read().then(function(result) {
                        if (result.done) {
                            var out = new Uint8Array(loaded);
                            var offset = 0;
                            for (var i = 0; i < chunks.length; i++) {
                                out.set(chunks[i], offset);
                                offset += chunks[i].byteLength;
                            }
                            if (bar) bar.style.width = '92%';
                            if (status) status.textContent = 'Step 2/3: Starting ' + engineLabel + ' Skia WebGL canvas...';
                            return out.buffer;
                        }
                        chunks.push(result.value);
                        loaded += result.value.byteLength;
                        var mb = (loaded / (1024 * 1024)).toFixed(1);
                        var pct = total > 0
                            ? Math.min(88, Math.round((loaded / total) * 85) + 10)
                            : Math.min(88, Math.round((loaded / (8.5 * 1024 * 1024)) * 80) + 10);
                        if (bar) bar.style.width = pct + '%';
                        if (status) status.textContent = 'Step 1/3: Loading ' + engineLabel + ' engine (' + mb + ' MB)... ' + pct + '%';
                        return pump();
                    });
                }
                return pump();
            }

            if (typeof WebAssembly !== 'undefined') {
                WebAssembly.instantiateStreaming = function(source, importObject, compileOptions) {
                    return Promise.resolve(source)
                        .then(readResponseBytesWithProgress)
                        .then(function(buffer) {
                            if (compileOptions !== undefined) {
                                return WebAssembly.instantiate(buffer, importObject, compileOptions);
                            }
                            return WebAssembly.instantiate(buffer, importObject);
                        });
                };
            }

            if (activeTarget === 'js') {
                document.write('<script src="/app/skiko.js"><\/script>');
                document.write('<script src="/app/webApp-js.js"><\/script>');
            } else {
                document.write('<script src="/app/webApp-wasm.js"><\/script>');
            }
        })();
    </script>
</body>
</html>
