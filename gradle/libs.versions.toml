[versions]
kotlin = "1.9.21"
spring-boot = "3.5.7"
spring-dependency-management = "1.1.0"
foojay-resolver = "0.5.0"
ktlint-gradle = "12.1.1"
detekt = "1.23.4"
json-org = "20231013"
jakarta-validation = "3.0.2"
firebase-admin = "9.3.0"
jobrunr = "8.7.1"
jsoup = "1.15.4"
webauthn-server-core = "2.9.0"
google-api-client = "2.2.0"
jjwt = "0.11.5"
springdoc-openapi = "2.8.8"
swagger-annotations = "2.2.30"
mysql-connector = "8.3.0"
mapstruct = "1.6.3"
sentry = "7.22.0"
kotlinx-html = "0.11.0"

[libraries]
# Spring Boot BOM (imported via dependencyManagement in library modules)
spring-boot-dependencies-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# Spring Boot starters — versions resolved transitively via the BOM above
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }

# Kotlin / Jackson interop
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
kotlinx-coroutines-jdk8 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8" }

# Database
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }
h2 = { module = "com.h2database:h2" }

# Domain-specific libraries
json-org = { module = "org.json:json", version.ref = "json-org" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jobrunr-spring-boot-starter = { module = "org.jobrunr:jobrunr-spring-boot-3-starter", version.ref = "jobrunr" }
webauthn-server-core = { module = "com.yubico:webauthn-server-core", version.ref = "webauthn-server-core" }
google-api-client = { module = "com.google.api-client:google-api-client", version.ref = "google-api-client" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }
swagger-annotations = { module = "io.swagger.core.v3:swagger-annotations-jakarta", version.ref = "swagger-annotations" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
sentry-spring-boot-starter-jakarta = { module = "io.sentry:sentry-spring-boot-starter-jakarta", version.ref = "sentry" }
sentry-core = { module = "io.sentry:sentry", version.ref = "sentry" }
kotlinx-html-jvm = { module = "org.jetbrains.kotlinx:kotlinx-html-jvm", version.ref = "kotlinx-html" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-plugin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
ktlint-gradle = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
